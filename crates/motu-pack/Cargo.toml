[package]
name = "manis-motu-pack"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Offline data package (.mrdp) container for Manis Road"
license = "MIT"

[lib]
name = "motu_pack"
path = "src/lib.rs"

[[bin]]
name = "motu-pack"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
manis-motu-routing = { path = "../motu-routing" }
motu_core = { package = "manis-motu-core", path = "../motu-core" }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
