[package]
name = "camera-cli"
version = "0.1.0"
edition = "2024"
description = "电子眼资料目录的 Tokio 命令行检查器"

[dependencies]
anyhow = "1"
manis-camera-catalog = { path = "../camera-catalog" }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
